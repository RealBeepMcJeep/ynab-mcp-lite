[project]
name = "ynab-mcp-lite"
version = "0.1.0"
description = "Deliberately tiny, non-destructive MCP server for YNAB"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_mcp_lite"]
