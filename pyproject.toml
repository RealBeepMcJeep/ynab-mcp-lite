[project]
name = "ynab-mcp-lite"
version = "0.1.0"
description = "Deliberately tiny, non-destructive MCP server for YNAB — read-first, add-only, unapproved by design."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
]

[project.scripts]
ynab-mcp-lite = "ynab_mcp_lite.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_mcp_lite"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
