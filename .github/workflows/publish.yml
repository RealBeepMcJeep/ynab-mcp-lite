# Build + publish the ynab-mcp-lite container image to GHCR, then smoke-test
# the pushed artifact (healthz + MCP handshake) before the run can go green.
#
# Tags: :sha-<commit> (immutable, for rollbacks) + :latest (rolling).
name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/realbeepmcjeep/ynab-mcp-lite

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build stamp
        id: stamp
        run: echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.time }}
            BUILD_TAG=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install uv (for the MCP handshake smoke)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Smoke-test the pushed image
        shell: bash
        run: |
          set -euo pipefail
          img="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | grep -m1 ':sha-')"
          echo "Testing: $img"
          cid="$(docker run -d --rm -p 18000:8000 "$img")"
          ok=""
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "healthz never came up; container logs:"
            docker logs "$cid" || true
            docker stop "$cid" || true
            exit 1
          fi
          echo "healthz: $(curl -fsS http://127.0.0.1:18000/healthz)"
          uv run --frozen python scripts/smoke.py http://127.0.0.1:18000
          docker stop "$cid" >/dev/null
